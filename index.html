<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAM-PM システム連携版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --bg: #F0F2F5; --accent: #D32F2F; --safe: #00897B; --dark: #263238; 
  --header-h: 60px; --card-header-h: 40px;
}

/* 全体レイアウト：画面に収めるための設定 */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100vh; width: 100vw; overflow: hidden; /* スクロール禁止 */
  font-family: 'Noto Sans JP', sans-serif; background: var(--bg); 
}
body { display: flex; flex-direction: column; }

header { 
  flex: 0 0 var(--header-h); background: #fff; border-bottom: 3px solid var(--accent);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}

main { 
  flex: 1; display: flex; overflow: hidden; padding: 10px; gap: 10px;
  height: calc(100vh - var(--header-h)); /* 残りの高さすべて */
}

/* カード構成 */
.card { 
  background: #fff; border-radius: 8px; border: 1px solid #ccc;
  display: flex; flex-direction: column; height: 100%; overflow: hidden;
}
.card-header { 
  height: var(--card-header-h); background: #f8f9fa; border-bottom: 1px solid #eee;
  padding: 0 15px; display: flex; align-items: center; font-weight: bold;
}
.card-body { 
  flex: 1; overflow-y: auto; padding: 15px; /* ここだけがスクロールする */
}

/* カラム設定 */
.col-left { flex: 0 0 400px; display: flex; flex-direction: column; gap: 10px; }
.col-right { flex: 1; min-width: 0; }

/* 自動計算表示エリア */
.stat-box { background: #fdf2f2; border: 2px solid var(--accent); border-radius: 8px; padding: 15px; text-align: center; }
.stat-val { font-family: 'Share Tech Mono'; font-size: 3.5rem; line-height: 1; color: var(--accent); }
.stat-label { font-size: 0.8rem; font-weight: bold; color: #666; }

/* タイムライン */
.tl-item { border-left: 3px solid #ddd; padding-left: 15px; margin-bottom: 15px; position: relative; }
.tl-item.stop { border-left-color: var(--accent); }
.tl-time { font-family: 'Share Tech Mono'; font-weight: bold; color: #888; }

/* モーダル：画面からはみ出さない設定 */
.modal-overlay { 
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); 
  z-index: 2000; align-items: center; justify-content: center; 
}
.modal-content { 
  background: #fff; width: 90%; max-width: 800px; max-height: 90vh; /* 高さ制限 */
  border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
}
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }
.modal-footer { flex: 0 0 70px; border-top: 1px solid #eee; display: flex; padding: 10px; gap: 10px; }

.btn { cursor: pointer; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; font-size: 1.2rem; }
</style>
</head>
<body>

<header>
  <div style="font-weight:900; font-size:1.2rem;">FAM-PM <small>PROD MONITOR</small></div>
  <div id="live-clock" style="font-family:'Share Tech Mono'; font-size:1.5rem; color:var(--accent);">00:00:00</div>
</header>

<main>
  <!-- 左：入力・実績管理 -->
  <div class="col-left">
    <section class="card">
      <div class="card-header">生産実績自動計算 (ROUND SLOTS)</div>
      <div class="card-body">
        <div class="stat-box">
          <span class="stat-label">現在の実績 (自動計算)</span>
          <div class="stat-val" id="disp-act">0</div>
          <div style="margin-top:10px; color:#666;">
            計画: <span id="disp-plan">120</span> | 
            ロス: <span id="disp-loss" style="color:var(--accent)">0</span>
          </div>
        </div>
        
        <div style="margin-top:20px;">
          <button class="btn btn-primary" onclick="openModal()">
            <i data-lucide="alert-circle" style="vertical-align:middle"></i> 変化点・停止を登録
          </button>
        </div>

        <div style="margin-top:20px; font-size:0.85rem; color:#444;">
          <p>※ 実績 = (経過時間 / サイクルタイム) - 停止ロス</p>
          <p>※ 1ラウンド：60分単位で自動更新</p>
        </div>
      </div>
    </section>
  </div>

  <!-- 右：タイムライン -->
  <div class="col-right">
    <section class="card">
      <div class="card-header">変化点・停止履歴</div>
      <div class="card-body" id="timeline-list">
        <!-- 履歴がここにスクロール可能で入る -->
      </div>
    </section>
  </div>
</main>

<!-- モーダル -->
<div id="regModal" class="modal-overlay">
  <div class="modal-content">
    <div class="card-header">変化点・停止登録</div>
    <div class="modal-body">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <div>
          <label>区分</label>
          <select id="m4-select" style="width:100%; padding:10px; margin-top:5px;">
            <option>設備(Machine)</option>
            <option>人(Man)</option>
            <option>材料(Material)</option>
            <option>方法(Method)</option>
          </select>
        </div>
        <div>
          <label>停止時間(分)</label>
          <input type="number" id="stop-min" value="0" style="width:100%; padding:10px; margin-top:5px;">
        </div>
      </div>
      <div style="margin-top:15px;">
        <label>内容詳細</label>
        <textarea id="issue-memo" style="width:100%; height:80px; margin-top:5px;" placeholder="チョコ停、刃具交換など"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="flex:1; background:#ccc;" onclick="closeModal()">キャンセル</button>
      <button class="btn" style="flex:2; background:var(--accent); color:#fff;" onclick="saveIssue()">登録して実績に反映</button>
    </div>
  </div>
</div>

<script>
// 設定値
const CONFIG = {
  startTime: new Date().setHours(8, 0, 0, 0), // 8時開始
  tactTime: 60, // 1個あたり60秒
  roundMinutes: 60 // 1ラウンド60分
};

let issues = [];
let totalLossCount = 0;

function updateCalculations() {
  const now = new Date();
  const elapsedSec = Math.floor((now - CONFIG.startTime) / 1000);
  
  if (elapsedSec < 0) return;

  // 理論上の計画数
  const planCount = Math.floor(elapsedSec / CONFIG.tactTime);
  document.getElementById('disp-plan').innerText = planCount;

  // 実績 = 計画 - ロス
  // (ロス個数 = 停止時間(秒) / タクト)
  const actCount = Math.max(0, planCount - totalLossCount);
  document.getElementById('disp-act').innerText = actCount;
}

function openModal() { document.getElementById('regModal').style.display = 'flex'; }
function closeModal() { document.getElementById('regModal').style.display = 'none'; }

function saveIssue() {
  const m4 = document.getElementById('m4-select').value;
  const mins = parseInt(document.getElementById('stop-min').value) || 0;
  const memo = document.getElementById('issue-memo').value;
  const timeStr = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});

  // ロス個数計算
  const lossInThisIssue = Math.floor((mins * 60) / CONFIG.tactTime);
  totalLossCount += lossInThisIssue;

  issues.push({ time: timeStr, m4, mins, memo, loss: lossInThisIssue });
  
  renderTimeline();
  updateCalculations();
  closeModal();
  
  // 入力リセット
  document.getElementById('stop-min').value = 0;
  document.getElementById('issue-memo').value = "";
}

function renderTimeline() {
  const container = document.getElementById('timeline-list');
  container.innerHTML = issues.map(i => `
    <div class="tl-item ${i.mins > 0 ? 'stop' : ''}">
      <div class="tl-time">${i.time}</div>
      <div style="font-weight:bold;">${i.m4} : ${i.memo}</div>
      <div style="font-size:0.8rem; color:var(--accent);">
        停止: ${i.mins}分 (影響: -${i.loss}pcs)
      </div>
    </div>
  `).reverse().join('');
}

setInterval(updateCalculations, 1000);
setInterval(() => {
  document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
}, 1000);

lucide.createIcons();
</script>
</body>
</html>
